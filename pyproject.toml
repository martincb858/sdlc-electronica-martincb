# pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = """
    --cov=.
    --cov-report=term-missing
    --cov-fail-under=80
"""

# ruff
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# E: Errores de estilo | F: Errores lógicos (Flakes) | I: Orden de imports (isort)
# UP: Sintaxis moderna (pyupgrade) | B: Prevención de bugs comunes (bugbear)
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

# mypy
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true  
ignore_missing_imports = true