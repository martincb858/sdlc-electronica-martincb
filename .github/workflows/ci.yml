name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt && pip install pytest pytest-cov ruff mypy
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy app --ignore-missing-imports
      - name: Tests
        run: pytest --cov=app --cov-fail-under=80