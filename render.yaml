services:
  - type: web
    name: sensorhub-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: sensorhub-db, property: connectionString }
databases:
  - name: sensorhub-db
    plan: free